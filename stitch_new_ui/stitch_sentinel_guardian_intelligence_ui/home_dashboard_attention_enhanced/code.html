<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center overflow-hidden">

</div>

<div class="flex flex-col gap-lg md:gap-xl h-full justify-center">

<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl">Your recent pattern is different from your usual range.</p>
</section>
<!-- Sentinel Signal (Attention State) -->
<section class="relative w-full h-64 md:h-96 rounded-xl overflow-hidden bg-surface-container-lowest border border-surface-dim shadow-[0px_4px_20px_rgba(26,28,27,0.04)] flex items-center justify-center p-md">
<!-- Inner soft inset for 'recessed' feel -->
<div class="absolute inset-0 border border-surface-dim opacity-50 rounded-xl pointer-events-none"></div>
<!-- Botanical Motif Accent -->
<img alt="Botanical motif accent" class="absolute bottom-0 left-4 h-32 w-auto opacity-30 mix-blend-multiply pointer-events-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBtT9kWzsoHHI_tR3YB8jZ9J5ENqkhLG0lejoznv2NbFvWov2WvZtNWbsqty_1h9NfoophW3CGoMvftbdWp9665UafcDdXDVrlSpycY_1PHSze3aDMpQwneydJqnrE1Gy1nDifpbKpOsKvOfXU5s6YUAPht7M75aCbHOmPJt0G25lOHq4tqPEk0AP1cyagiHaier_EBmThX_87nSYaoleuyT64ebfVNZvuQOeMo7jx5znWW9bhHOOsl"/>
<!-- SVG Visualization representing the Sentinel Signal in Attention State -->
<svg class="w-full h-full relative z-10" height="100%" preserveaspectratio="none" viewbox="0 0 1000 300" width="100%">
<!-- Baseline - Thin dashed line #dadad7 (surface-dim) -->
<path d="M 0 150 Q 250 150 500 150 T 1000 150" fill="none" stroke="#dadad8" stroke-dasharray="8 8" stroke-width="2"></path>
<!-- Gradient Area under current flow -->
<path d="M 0 150 C 200 140 300 100 400 60 C 500 20 600 280 700 240 C 800 200 900 160 1000 150 L 1000 300 L 0 300 Z" fill="url(#attentionGradient)"></path>
<!-- Current Flow - Thick organic solid line #712895 (tertiary) for deviation -->
<path class="animate-[dash_3s_ease-in-out_infinite]" d="M 0 150 C 200 140 300 100 400 60 C 500 20 600 280 700 240 C 800 200 900 160 1000 150" fill="none" stroke="#7300a4" stroke-linecap="round" stroke-width="4"></path>
<defs>
<!-- Gradient mapped to tertiary color for attention state (5% opacity) -->
<lineargradient id="attentionGradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#7300a4" stop-opacity="0.1"></stop>
<stop offset="100%" stop-color="#7300a4" stop-opacity="0.0"></stop>
</lineargradient>
</defs>
</svg>
<!-- Indicator Chip -->
<div class="absolute top-4 right-4 bg-tertiary-fixed text-on-tertiary-fixed-variant font-label-sm text-label-sm px-3 py-1 rounded-full flex items-center gap-2 z-20">

                </div>
