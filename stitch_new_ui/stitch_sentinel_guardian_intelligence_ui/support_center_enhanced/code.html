<style>
        .pulse-soft {
            animation: pulse-soft 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center">
<!-- Top Navigation (Transactional/Task-focused, suppressed main shell, custom header) -->
<header class="w-full max-w-screen-md mx-auto fixed top-0 bg-surface/90 backdrop-blur-md z-50 flex items-center justify-between px-container-padding-mobile h-20">
<button aria-label="Back to Home" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors" onclick="window.history.back()">
<span class="material-symbols-outlined text-primary text-[24px]">close</span>
</button>
<div class="font-title-lg text-title-lg text-primary opacity-0 transition-opacity duration-300" id="headerTitle">Support</div>
<div class="w-12 h-12"></div> <!-- Placeholder for balance -->
</header>
<main class="w-full max-w-screen-md mx-auto px-container-padding-mobile pt-32 pb-32 flex-grow flex flex-col">
<!-- Hero / Emotional Anchor -->
<section class="mb-[64px] flex flex-col items-center text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-tertiary mb-sm max-w-[300px]">
                You don't have to handle this alone.
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[90%] mb-xl">
                We are here to help. Reach out to someone now.
            </p>
<div class="w-56 h-56 md:w-64 md:h-64 flex items-center justify-center mb-md">
<img alt="Botanical Motif" class="w-full h-full object-contain mix-blend-multiply opacity-90" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBtT9kWzsoHHI_tR3YB8jZ9J5ENqkhLG0lejoznv2NbFvWov2WvZtNWbsqty_1h9NfoophW3CGoMvftbdWp9665UafcDdXDVrlSpycY_1PHSze3aDMpQwneydJqnrE1Gy1nDifpbKpOsKvOfXU5s6YUAPht7M75aCbHOmPJt0G25lOHq4tqPEk0AP1cyagiHaier_EBmThX_87nSYaoleuyT64ebfVNZvuQOeMo7jx5znWW9bhHOOsl"/>
</div>
</section>
<!-- Primary Actions (Tertiary Palette focus for support context) -->
<section class="flex flex-col gap-lg w-full max-w-md mx-auto mb-[64px]">
<!-- Tele-MANAS Call -->
<button class="w-full h-20 bg-tertiary-container text-on-tertiary-container rounded-2xl flex items-center px-lg shadow-[0px_8px_24px_rgba(107,33,143,0.12)] active:scale-95 transition-all duration-200">
<div class="w-12 h-12 rounded-full bg-tertiary flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-on-tertiary">call</span>
</div>
<div class="flex flex-col items-start text-left">
<span class="font-title-lg text-title-lg font-bold">Talk to Tele-MANAS</span>
<span class="font-label-md text-label-md opacity-80">14416 - Free, 24/7 Confidential Help</span>
</div>
</button>
<!-- Trusted Contact -->
<button class="w-full h-20 bg-surface-container-lowest text-tertiary border border-surface-dim rounded-2xl flex items-center px-lg active:scale-95 transition-all duration-200 hover:bg-surface-container-low shadow-sm">
<div class="w-12 h-12 rounded-full bg-tertiary-fixed flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-tertiary">person</span>
</div>
<div class="flex flex-col items-start text-left">
<span class="font-title-lg text-title-lg font-bold">Contact Trusted Person</span>
<span class="font-label-md text-label-md text-on-surface-variant">Mom (Primary Contact)</span>
</div>
</button>
<!-- Emergency Services (Secondary Action) -->
<button class="w-full h-16 bg-error-container/80 text-on-error-container rounded-2xl flex items-center justify-center px-lg active:scale-95 transition-all duration-200 mt-sm hover:bg-error-container">
<span class="material-symbols-outlined mr-sm text-[20px]">emergency</span>
<span class="font-label-md text-label-md font-bold">Call Emergency Services (112)</span>
</button>
</section>
<!-- Immediate Grounding Module (Tactile & Calm) -->
<section class="mt-auto pt-xl border-t border-surface-dim w-full max-w-md mx-auto">
<h2 class="font-title-lg text-title-lg text-on-surface mb-lg px-xs text-center">Immediate Grounding</h2>
<div class="bg-surface-container-lowest rounded-2xl p-lg border border-surface-dim relative overflow-hidden shadow-sm">
<!-- Inner privacy inset feeling -->
<div class="absolute inset-0 border border-white/50 rounded-2xl pointer-events-none"></div>
<div class="flex flex-col items-center gap-md relative z-10 text-center">
<div class="w-12 h-12 rounded-full bg-secondary-container flex-shrink-0 flex items-center justify-center mb-xs">
<span class="material-symbols-outlined text-on-secondary-container" data-weight="fill">air</span>
</div>
<div>
<h3 class="font-title-lg text-title-lg font-bold text-on-surface mb-sm">Breathe With Me</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg max-w-[260px] mx-auto">Follow the expanding circle to slow your breathing and heart rate.</p>
<!-- Mini Breathing Visualizer -->
<div class="h-40 w-full bg-surface-container-low rounded-xl flex items-center justify-center relative overflow-hidden border border-[#dadad7]/50">
<div class="absolute inset-0 opacity-10 bg-gradient-to-r from-transparent via-primary-container to-transparent"></div>
<!-- Baseline -->
<div class="absolute w-full h-[1px] border-b border-dashed border-[#dadad7] top-1/2 -translate-y-1/2"></div>
<!-- Breathing Circle -->
<div class="w-20 h-20 rounded-full bg-primary-container/10 border-2 border-primary-container/30 flex items-center justify-center pulse-soft" style="animation-duration: 6s;">
<div class="w-10 h-10 rounded-full bg-primary-container opacity-40 pulse-soft" style="animation-duration: 6s; animation-delay: 0.2s;"></div>
</div>
</div>
</div>
</div>
</div>
</section>
</main>
<script>
        // Simple header title appearance on scroll
        const headerTitle = document.getElementById('headerTitle');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 80) {
                headerTitle.classList.remove('opacity-0');
            } else {
                headerTitle.classList.add('opacity-0');
            }
        });
    </script>
</body></html>
