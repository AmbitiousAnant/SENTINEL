<body class="bg-surface-container min-h-screen flex items-center justify-center px-mobile-margin md:px-desktop-margin antialiased">
<!-- Main Card Container -->
<div class="w-full max-w-md bg-surface rounded-[16px] border border-outline-variant/20 shadow-[0_4px_20px_rgba(71,107,91,0.04)] overflow-hidden">
<div class="p-8 md:p-10 flex flex-col items-center">
<!-- Brand & Headline -->
<div class="text-center mb-10 w-full">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight mb-2 uppercase">SENTINEL</h1>
<p class="font-headline-md text-headline-md text-on-surface">Notice change. Bring support.</p>
</div>
<!-- Form Area -->
<form class="w-full flex flex-col gap-5">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/20 text-on-surface font-body-md text-body-md rounded-lg px-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder-on-surface-variant/50" id="email" placeholder="name@example.com" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant/20 text-on-surface font-body-md text-body-md rounded-lg px-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" type="password"/>
</div>
<!-- Sign In Action -->
<button class="mt-2 w-full bg-primary text-on-primary font-label-md text-label-md py-3.5 rounded-lg flex items-center justify-center gap-2 hover:bg-primary/90 transition-colors" type="submit">
                    Sign in
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-4 my-8">
<div class="flex-1 h-px bg-outline-variant/30"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Or</span>
<div class="flex-1 h-px bg-outline-variant/30"></div>
</div>
<!-- Secondary Action -->
<button class="w-full border border-outline/30 text-on-surface bg-surface-container-lowest font-label-md text-label-md py-3.5 rounded-lg flex items-center justify-center gap-3 hover:bg-surface-variant/30 transition-colors">

                Continue with Google

</a>
</div>
